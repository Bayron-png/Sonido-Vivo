<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Registrarse</title>
    <link rel="stylesheet" href="css/base-style.css">
    <link rel="stylesheet" href="css/ingreso.css">
    <script src="js/validaciones.js" defer></script>
    <script src="js/login.js" defer></script>
</head>

<body>
    <header>
        <a href="menu.html">
            <img src="https://cdn.pixabay.com/photo/2017/05/05/16/37/logo-2287665_960_720.png" alt="Logo-guitarra">
        </a>
        <h1>Sonido Vivo</h1>
        <p class="eslogan-text">Música para todos</p>
    </header>

    <main>
        <div class="barra-menu"><a href="menu.html" class="btn-volver">⬅  Volver al menú</a></div>

        <section id="login" class="contenedor-log-reg">
            <div class="contenedor-titulo">
                <h2 class="titulo-tema">Iniciar sesión</h2>
            </div>
            <form id="form-login" novalidate class="formulario-log-reg">

                <label for="correo-login">Correo</label>
                <input type="email" required placeholder="Ingrese su correo" id="correo-login" maxlength="100">
                
                <label for="l_pass">Contraseña</label>
                <input type="password" required placeholder="Ingrese su contraseña" id="l_pass" minlength="4" maxlength="10">
        
                <button type="submit">Iniciar sesion</button>
                
                <p>
                    ¿No tienes una cuenta?
                    <a href="registro.html">Registrate</a>
                </p>

            </form>
        </section>
    </main>

    <footer>
        <p class="copyright-text">© Sonido Vivo 2026</p>
    </footer>
</body>

</html>
