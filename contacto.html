<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <link rel="stylesheet" href="css/base-style.css">
    <link rel="stylesheet" href="css/acercade.css">
    <script src="js/validaciones.js" defer></script>
    <script src="js/contacto.js" defer></script>
</head>

<body>
    <header>
        <a href="menu.html">
            <img src="https://cdn.pixabay.com/photo/2017/05/05/16/37/logo-2287665_960_720.png" alt="Logo-guitarra">
        </a>
        <h1>Sonido Vivo</h1>
        <p class="eslogan-text">Música para todos</p>
    </header>

    <main>
        <div class="barra-menu"><a href="menu.html" class="btn-volver">⬅ Volver al menú</a></div>

        <div class="contenedor-titulo">
            <h2 class="titulo-tema">Contáctanos</h2>
        </div>
        <section class="contenedor-contacto" class="seccion-descripcion" id="contacto"> 
            <form class="formulario-contacto" id="form-contacto" novalidate> 
                <label for= "nombre">Nombre</label>
                <input type="text" placeholder="Ingresa tu nombre" id="nombre" maxlength="60" required>

                <label for="correo">Correo</label>
                <input type="email" placeholder="Ingresa tu correo" id="correo" maxlength="100" required>

                <label for="asunto">Motivo de contacto</label>
                <select id="asunto" required>
                    <option disabled selected hidden>Selecione un motivo</option>
                    <option>Solicitud de informacion (productos o tiendas)</option>
                    <option>Problemas para comprar</option>
                    <option>Problemas con el despacho</option>
                    <option>Cambios y devoluciones</option>
                    <option>Reclamos</option>
                </select>

                <label for="mensaje">Mensaje</label>
                <textarea id ="mensaje" rows="3" maxlength="500" required></textarea>

                <button type="submit">Enviar</button>
                <!--<p id="mensaje-confirmacion"></p> -->
            </form>
        </section>
    </main>

    <footer>
        <p class="copyright-text">© Sonido Vivo 2026</p>
    </footer>
</body>

</html>
