<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
    <link rel="stylesheet" href="css/base-style.css">
    <link rel="stylesheet" href="css/checkout.css">
    <script src="js/checkout.js" defer></script>
</head>

<body>
    <header>
        <a class="ico-logo" href="menu.html">
            <img src="https://cdn.pixabay.com/photo/2017/05/05/16/37/logo-2287665_960_720.png" alt="Logo-guitarra">
        </a>
        <h1>Sonido Vivo</h1>
        <p class="eslogan-text">Música para todos</p>
        <a class="ico-carrito" href="checkout.html">
            <img src="resources/icons8-shopping-cart-64.png" alt="carrito">
        </a>
    </header>

    <main>
        <div><a href="catalogo.html" class="btn-volver"> volver</a></div>
        <section class="carrito">
            <div class="productos">
                <div class="producto">
                    <img src="https://www.yamaki.com.co/musica-audio-consumo/wp-content/uploads/sites/2/2021/11/HMHD508_01.png"
                        alt="Amplificador">
                    <div class="info-producto">
                        <h3>Amplificador</h3>
                        <p>$449.990</p>

                        <div class="cantidad">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="resumen" id="detalle-compra">
            <h2>Resumen de compra</h2>

            <p>Subtotal: $50.000</p>
            <p>Envío: $3.000</p>

            <hr>

            <h2>Total: $53.000</h2>

            <button id="continuarCompra" type="button">Continuar compra</button>
        </section>

    </main>

    <footer>
    </footer>

</body>

</html>
