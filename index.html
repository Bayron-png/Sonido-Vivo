<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonido Vivo</title>
    <link rel="stylesheet" href="style.css"> 
    <script src="js/validaciones.js" defer></script>
    <script src="js/contacto.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html"><img src="https://cdn.pixabay.com/photo/2017/05/05/16/37/logo-2287665_960_720.png" alt="Logo-guitarra"></a>
        <h1>Sonido Vivo</h1>

    </header>

    <section class="st_contacto" id="contacto"> 
        <h2>Contactanos</h2>
        <form id="form-contacto" novalidate> 
            <label for= "nombre">Nombre completo</label>
            <input type="text" id="nombre" required>

            <label for="correo">Correo</label>
            <input type="email" id="correo" required>

            <label for="asunto">Asunto</label>
            <select id="asunto" required>
                <option>Consulta general</option>
                <option>Reclamo</option>
                <option>Otro</option>
            </select>

            <label for="mensaje">Mensaje</label>
            <textarea id ="mensaje" rows="3" required></textarea>

            <button type="submit">Enviar</button>
            <p id="mensaje-confirmacion"></p>
        </form>
    </section>
    
</body>

</html>
