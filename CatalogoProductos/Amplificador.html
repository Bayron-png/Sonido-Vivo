<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amplificador</title>
    <link rel="stylesheet" href="../css/base-style.css">
    <link rel="stylesheet" href="../css/producto.css">
    <script src="../js/producto.js" defer></script>

<body>
    <header>
        <a class="ico-logo" href="../menu.html">
            <img src="https://cdn.pixabay.com/photo/2017/05/05/16/37/logo-2287665_960_720.png" alt="Logo-guitarra">
        </a>
        <h1>Sonido Vivo</h1>
        <p class="eslogan-text">Música para todos</p>
        <a class="ico-carrito" href="../checkout.html">
           <img src="../resources/icons8-shopping-cart-64.png" alt="carrito">
        </a>
    </header>

    <main>
        <div class="barra-catalogo"><a href="../catalogo.html" class="btn-volver">⬅ Volver al catálogo</a></div>

        <section class="seccion-producto">
            <img src="https://www.yamaki.com.co/musica-audio-consumo/wp-content/uploads/sites/2/2021/11/HMHD508_01.png" alt="amplificador">
            <div class="producto-info">

             
                    <h2>Amplificador</h2>
  
                <p class="marca-modelo">Hartke - modelo: HD100</p>
                
                    <div class="caracteristicas">
                        <h3>Caracteristicas</h3>
                        <ul>
                            <li>100W</li>
                            <li>tweeter integrado</li>
                            <li>ecualizador de 4 bandas</li>
                        </ul>
                    </div>

                <p class="stock">Stock disponible: 2 unidades</p>

                <p class="precio">$449.990</p>

                <div class="compra">
                    <input type="numer" value="1" min="1">
                    <button id="btn-agregar">Agregar al carrito</button>
                </div>
            </div>
        </section>   
    </main>

    <footer>
        <p class="copyright-text">© Sonido Vivo 2026</p>
    </footer>
</body>

</html>
